<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>运动识别</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .loading-text {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #0052D9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-progress {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    .error-message {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      text-align: center;
    }

    .error-title {
      font-size: 24px;
      color: #ff4444;
      margin-bottom: 20px;
    }

    .error-text {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .error-btn {
      padding: 15px 30px;
      background: #0052D9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- 加载提示 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-text" id="loadingText">加载中...</div>
    <div class="loading-spinner"></div>
    <div class="loading-progress" id="loadingProgress">正在加载模型，首次可能需要5-10秒</div>
  </div>

  <!-- 错误提示 -->
  <div class="error-message" id="errorOverlay" style="display: none;">
    <div class="error-title">加载失败</div>
    <div class="error-text" id="errorText">请检查网络连接或刷新页面重试</div>
    <button class="error-btn" onclick="location.reload()">刷新页面</button>
  </div>

  <!-- 视频和Canvas -->
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <!-- TensorFlow.js -->
  <script src="https://unpkg.com/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://unpkg.com/@tensorflow-models/pose-detection@2.1.0/dist/pose-detection.min.js"></script>

  <script>
    console.log('[运动识别] 页面加载完成');
    console.log('[运动识别] TensorFlow.js 版本:', tf.version.tfjs);

    function showError(message) {
      document.getElementById('loadingOverlay').classList.add('hidden');
      document.getElementById('errorOverlay').style.display = 'flex';
      document.getElementById('errorText').textContent = message;
    }

    function updateLoading(text, progress) {
      document.getElementById('loadingText').textContent = text;
      if (progress) {
        document.getElementById('loadingProgress').textContent = progress;
      }
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }

    // 从URL获取参数
    const urlParams = new URLSearchParams(window.location.search);
    const sportCode = urlParams.get('code') || 'high_knee_lift';
    const sportName = decodeURIComponent(urlParams.get('name') || '高抬腿');

    console.log('[运动识别] 运动类型:', sportCode, sportName);

    // 全局变量
    let detector = null;
    let isDetecting = false;
    let count = 0;
    let video = null;
    let canvas = null;
    let ctx = null;
    let animationId = null;
    let useFrontCamera = false;

    // COCO骨架连接线
    const SKELETON_CONNECTIONS = [
      [0, 1], [0, 2], [1, 3], [2, 4],
      [0, 5], [0, 6], [5, 7], [7, 9], [6, 8], [8, 10],
      [5, 11], [6, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 12]
    ];

    // 初始化
    async function init() {
      console.log('[运动识别] 开始初始化...');

      try {
        updateLoading('加载中...', '正在从GitHub加载模型...');

        // 从 GitHub 加载模型
        const modelUrl = 'https://smartfitoss.github.io/smartfit-sport/model.json';

        console.log('[运动识别] 模型URL:', modelUrl);

        updateLoading('加载中...', '正在创建检测器...');

        detector = await poseDetection.createDetector(
          poseDetection.SupportedModels.MoveNet,
          {
            modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
            modelUrl: modelUrl
          }
        );

        console.log('[运动识别] MoveNet 检测器创建成功');
        updateLoading('加载中...', '模型加载完成，正在启动摄像头...');

        await initCamera();

        console.log('[运动识别] 初始化完成！');
        hideLoading();

        startDetection();

      } catch (error) {
        console.error('[运动识别] 初始化失败:', error);
        showError('初始化失败：' + error.message);
      }
    }

    async function initCamera() {
      video = document.getElementById('video');
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: useFrontCamera ? 'user' : 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        console.log('[运动识别] 摄像头就绪');

      } catch (error) {
        console.error('[运动识别] 摄像头启动失败:', error);
        throw new Error('摄像头启动失败: ' + error.message);
      }
    }

    function startDetection() {
      isDetecting = true;
      detectLoop();
    }

    async function detectLoop() {
      if (!isDetecting || !detector) return;

      try {
        const poses = await detector.estimatePoses(video);

        if (poses && poses.length > 0) {
          const pose = poses[0];
          drawSkeleton(pose);
        }

      } catch (error) {
        console.error('[运动识别] 识别错误:', error);
      }

      animationId = requestAnimationFrame(detectLoop);
    }

    function drawSkeleton(pose) {
      if (!ctx) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 3;

      for (const [startIdx, endIdx] of SKELETON_CONNECTIONS) {
        const startKp = pose.keypoints[startIdx];
        const endKp = pose.keypoints[endIdx];

        if (startKp.score > 0.3 && endKp.score > 0.3) {
          ctx.beginPath();
          ctx.moveTo(startKp.x, startKp.y);
          ctx.lineTo(endKp.x, endKp.y);
          ctx.stroke();
        }
      }

      for (const kp of pose.keypoints) {
        if (kp.score > 0.3) {
          ctx.beginPath();
          ctx.arc(kp.x, kp.y, 6, 0, 2 * Math.PI);
          ctx.fillStyle = '#ff0000';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
