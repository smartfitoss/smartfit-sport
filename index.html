<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>运动识别</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    /* 加载提示 */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .loading-text {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #0052D9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-progress {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    .error-message {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      text-align: center;
    }

    .error-title {
      font-size: 24px;
      color: #ff4444;
      margin-bottom: 20px;
    }

    .error-text {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .error-btn {
      padding: 15px 30px;
      background: #0052D9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- 加载提示 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-text" id="loadingText">加载中...</div>
    <div class="loading-spinner"></div>
    <div class="loading-progress" id="loadingProgress">正在加载模型，首次可能需要5-10秒</div>
  </div>

  <!-- 错误提示 -->
  <div class="error-message" id="errorOverlay" style="display: none;">
    <div class="error-title">加载失败</div>
    <div class="error-text" id="errorText">请检查网络连接或刷新页面重试</div>
    <button class="error-btn" onclick="location.reload()">刷新页面</button>
  </div>

  <!-- TensorFlow.js CDN -->
  <script>
    // 错误处理
    window.addEventListener('error', function(e) {
      console.error('[页面错误]', e.error);
      showError('加载失败：' + e.message);
    });

    function showError(message) {
      document.getElementById('loadingOverlay').classList.add('hidden');
      document.getElementById('errorOverlay').style.display = 'flex';
      document.getElementById('errorText').textContent = message;
    }

    function updateLoading(text, progress) {
      document.getElementById('loadingText').textContent = text;
      if (progress) {
        document.getElementById('loadingProgress').textContent = progress;
      }
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }

    console.log('[运动识别] 开始加载...');
    updateLoading('加载中...', '正在加载 TensorFlow.js...');
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.11.0/dist/tf.min.js" 
          onerror="showError('TensorFlow.js 加载失败，请检查网络连接')"
          onload="console.log('[TensorFlow.js] Core 加载成功'); updateLoading('加载中...', 'TensorFlow.js Core 就绪，正在加载其他模块...');"></script>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.11.0/dist/tf-converter.min.js"
          onerror="showError('TensorFlow.js Converter 加载失败')"
          onload="console.log('[TensorFlow.js] Converter 加载成功');"></script>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.11.0/dist/tf-backend-webgl.min.js"
          onerror="showError('TensorFlow.js Backend 加载失败')"
          onload="console.log('[TensorFlow.js] Backend 加载成功'); updateLoading('加载中...', '正在加载识别模型...');"></script>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.0/dist/pose-detection.min.js"
          onerror="showError('MoveNet 模型加载失败')"
          onload="console.log('[MoveNet] 模型加载成功'); updateLoading('加载中...', '所有库加载完成，正在初始化...');"></script>

  <script>
    // 从URL获取参数
    const urlParams = new URLSearchParams(window.location.search);
    const sportCode = urlParams.get('code') || 'high_knee_lift';
    const sportName = decodeURIComponent(urlParams.get('name') || '高抬腿');

    console.log('[运动识别] 运动类型:', sportName, sportName);

    // 全局变量
    let detector = null;
    let isDetecting = false;
    let count = 0;
    let video = null;
    let canvas = null;
    let ctx = null;
    let animationId = null;
    let useFrontCamera = false;

    // COCO骨架连接线
    const SKELETON_CONNECTIONS = [
      [0, 1], [0, 2], [1, 3], [2, 4], // 头部
      [0, 5], [0, 6], [5, 7], [7, 9], [6, 8], [8, 10], // 上肢
      [5, 11], [6, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 12] // 下肢
    ];

    // 初始化
    async function init() {
      console.log('[运动识别] 初始化...');

      try {
        updateLoading('加载中...', '正在初始化 TensorFlow.js...');

        // 等待TensorFlow.js后端初始化
        await tf.ready();
        console.log('[运动识别] TensorFlow.js 后端就绪');
        updateLoading('加载中...', 'TensorFlow.js就绪，正在加载模型...');

        // 创建MoveNet检测器
        detector = await poseDetection.createDetector(
          poseDetection.SupportedModels.MoveNet,
          { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
        );

        console.log('[运动识别] MoveNet模型加载完成');
        updateLoading('加载中...', '模型加载完成，正在启动摄像头...');

        // 初始化摄像头
        await initCamera();

        // 绑定事件
        bindEvents();

        // 隐藏加载提示
        hideLoading();

        console.log('[运动识别] 初始化完成！');

      } catch (error) {
        console.error('[运动识别] 初始化失败:', error);
        showError('初始化失败：' + error.message);
      }
    }

    // 初始化摄像头
    async function initCamera() {
      video = document.createElement('video');
      canvas = document.createElement('canvas');
      ctx = canvas.getContext('2d');

      document.body.appendChild(video);
      document.body.appendChild(canvas);

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: useFrontCamera ? 'user' : 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = stream;
        await video.play();

        // 设置Canvas尺寸
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // 设置样式
        video.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);';
        canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;';

        console.log('[运动识别] 摄像头就绪');

      } catch (error) {
        console.error('[运动识别] 摄像头启动失败:', error);
        throw error;
      }
    }

    // 绑定事件
    function bindEvents() {
      // 这里可以添加按钮等UI元素的事件
    }

    // 绘制骨架
    function drawSkeleton(pose) {
      // 清空Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 绘制连接线
      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 3;

      for (const [startIdx, endIdx] of SKELETON_CONNECTIONS) {
        const startKp = pose.keypoints[startIdx];
        const endKp = pose.keypoints[endIdx];

        if (startKp.score > 0.3 && endKp.score > 0.3) {
          ctx.beginPath();
          ctx.moveTo(startKp.x, startKp.y);
          ctx.lineTo(endKp.x, endKp.y);
          ctx.stroke();
        }
      }

      // 绘制关键点
      for (const kp of pose.keypoints) {
        if (kp.score > 0.3) {
          ctx.beginPath();
          ctx.arc(kp.x, kp.y, 6, 0, 2 * Math.PI);
          ctx.fillStyle = '#ff0000';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    }

    // 页面加载完成后初始化
    window.addEventListener('load', init);
  </script>
</body>
</html>
